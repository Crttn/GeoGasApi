spring.application.name=geogas-api

# ----------------------------------------
# CONEXIÓN A POSTGRESQL
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/Geogasolineras
spring.datasource.username=postgres
spring.datasource.password=Hyeros543
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# CONFIGURACIÓN DE JPA E HIBERNATE SPATIAL
# ----------------------------------------

# Permite que Spring cree las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# Muestra el SQL en la consola (útil para desarrollo)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------
# CONFIGURACIÓN DEL SERVIDOR
# ----------------------------------------
server.port=8080

# ----------------------------------------
# TAREAS PROGRAMADAS (GeoGas Scraper)
# ----------------------------------------
# Se ejecuta todos los días a las 06:00 AM
app.cron.sync-prices=0 0 6 * * ?